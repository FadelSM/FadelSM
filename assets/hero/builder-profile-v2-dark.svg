<text x="528" y="211" class="system-section" fill="#8B949E">- BUILD.FOCUS -----------------------------------</text>
<text x="528" y="232.5" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Product</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Idea to working release</tspan></text>
