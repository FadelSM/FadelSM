<text x="528" y="275.5" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Web3</tspan><tspan fill="#8B949E">: .......... </tspan><tspan fill="#F0F6FC">Smart contracts and payments</tspan></text>
<text x="528" y="297" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Quality</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Testing and reliability</tspan></text>
