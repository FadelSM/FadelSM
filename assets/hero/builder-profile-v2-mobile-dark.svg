    <circle cx="92" cy="160" r="2.2" opacity="0.42"/>
    <circle cx="628" cy="404" r="2.2" opacity="0.42"/>
    <circle cx="110" cy="304.2" r="1.7" opacity="0.32"/>
    <circle cx="612" cy="198.2" r="1.7" opacity="0.28"/>
  </g>
</g>
