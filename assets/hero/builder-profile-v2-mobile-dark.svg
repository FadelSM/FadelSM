<text x="72" y="793" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Fradium</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Web3 address risk</tspan></text>
