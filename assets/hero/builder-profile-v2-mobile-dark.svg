  <ellipse cx="360.0" cy="256.2" rx="267.5" ry="104.5" fill="url(#portrait-halo)"/>
  <ellipse class="motion-orbit motion-orbit--forward" style="transform-origin:360.0px 256.2px" cx="360.0" cy="256.2" rx="247.6" ry="96.7" fill="none" stroke="#C9D1D9" stroke-width="1" stroke-dasharray="3 14" opacity="0.13"/>
  <ellipse class="motion-orbit motion-orbit--backward" style="transform-origin:360.0px 256.2px" cx="360.0" cy="256.2" rx="198.1" ry="73.5" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="28 24" opacity="0.1"/>
  <path d="M 92 160 H 154 M 92 160 V 214 M 628 404 H 566 M 628 404 V 350" fill="none" stroke="#58A6FF" stroke-width="1.2" opacity="0.2"/>
  <path d="M 92 298.2 C 124.0 264.2, 211.4 314.2, 265.9 283.2" fill="none" stroke="#C9D1D9" stroke-width="1" opacity="0.12"/>
  <path d="M 628 204.2 C 590.0 238.2, 513.5 186.2, 459.1 226.2" fill="none" stroke="#8B949E" stroke-width="1" opacity="0.11"/>
