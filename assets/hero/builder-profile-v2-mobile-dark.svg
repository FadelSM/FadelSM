<text x="72" y="604" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Mode</tspan><tspan fill="#8B949E">: .......... </tspan><tspan fill="#F0F6FC">Designing / Building / Shipping</tspan></text>
<text x="72" y="646" class="system-section" fill="#8B949E">- BUILD.FOCUS -----------------------------------</text>
<text x="72" y="667" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Product</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Idea to working release</tspan></text>
<text x="72" y="688" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">AI</tspan><tspan fill="#8B949E">: ............ </tspan><tspan fill="#F0F6FC">Agents and tool use</tspan></text>
<text x="72" y="709" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Web3</tspan><tspan fill="#8B949E">: .......... </tspan><tspan fill="#F0F6FC">Smart contracts and payments</tspan></text>
<text x="72" y="730" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Quality</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">Testing and reliability</tspan></text>
