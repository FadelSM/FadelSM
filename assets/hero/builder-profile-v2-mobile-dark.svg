<text x="72" y="835" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Nova AI</tspan><tspan fill="#8B949E">: ....... </tspan><tspan fill="#F0F6FC">AI wallet orchestration</tspan></text>
<text x="72" y="856" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">SpecHeal</tspan><tspan fill="#8B949E">: ...... </tspan><tspan fill="#F0F6FC">AI-assisted test recovery</tspan></text>
