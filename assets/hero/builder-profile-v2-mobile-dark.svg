<text x="72" y="520" class="system-head"><tspan fill="#8B949E">wildan@build</tspan><tspan fill="#8B949E"> ------------------------------------------</tspan></text>
<text x="72" y="541" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Name</tspan><tspan fill="#8B949E">: .......... </tspan><tspan fill="#F0F6FC">Wildan Syukri Niam</tspan></text>
<text x="72" y="562" class="system-row"><tspan fill="#8B949E">. </tspan><tspan class="system-key" fill="#58A6FF">Role</tspan><tspan fill="#8B949E">: .......... </tspan><tspan fill="#F0F6FC">Full-Stack Builder</tspan></text>
